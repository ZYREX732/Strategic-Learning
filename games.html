<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Z-Games — World Explorer GeoGuessr</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Pannellum 360 Viewer (100% Free Open-Source) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <!-- Leaflet Map (100% Free OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase Compat SDKs (10.7.1) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #030712;
      color: #f8fafc;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    #panorama-view {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
    }
    .glass-ui {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    /* Collapsible Mini Map */
    #guess-map-container {
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 30;
    }
    #guess-map-container.minimized {
      width: 280px;
      height: 190px;
      opacity: 0.92;
    }
    #guess-map-container.minimized:hover {
      opacity: 1;
    }
    #guess-map-container.expanded {
      width: min(620px, 92vw);
      height: min(440px, 68vh);
      opacity: 1;
    }
    .leaflet-container {
      background: #090d16 !important;
      border-radius: 1rem;
    }
    /* Custom Pin Markers */
    .custom-guess-icon, .custom-target-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body class="relative select-none">

  <!-- 1. Fullscreen 360° Panorama Viewer Container -->
  <div id="panorama-view"></div>

  <!-- 2. Top Header Overlay -->
  <header class="absolute top-4 left-4 right-4 z-40 flex items-center justify-between pointer-events-none">
    <!-- Left: Branding & Back to Chess -->
    <div class="flex items-center gap-3 pointer-events-auto">
      <a href="app.html" class="glass-ui px-4 py-2.5 rounded-2xl flex items-center gap-2.5 text-xs font-black text-amber-400 hover:text-amber-300 transition-all hover:scale-105 shadow-2xl">
        <i class="fa-solid fa-chess-knight text-base"></i>
        <span>Return to Z-Chess</span>
      </a>

      <div class="glass-ui px-3.5 py-2.5 rounded-2xl flex items-center gap-2 text-xs font-bold text-white shadow-2xl hidden sm:flex">
        <i class="fa-solid fa-earth-americas text-cyan-400"></i>
        <span>World Explorer 360°</span>
      </div>
    </div>

    <!-- Right: Shared Coins & Round Counter -->
    <div class="flex items-center gap-3 pointer-events-auto">
      <div class="glass-ui px-4 py-2 rounded-2xl flex items-center gap-2 text-xs font-bold shadow-2xl">
        <i class="fa-solid fa-coins text-amber-400 text-sm"></i>
        <span id="player-coins" class="text-amber-400 font-mono text-sm">0</span>
        <span class="text-[10px] text-slate-400 font-mono">ZC</span>
      </div>

      <div class="glass-ui px-3 py-2 rounded-2xl text-xs font-mono font-bold text-cyan-300 shadow-2xl">
        Round <span id="round-number">1</span>
      </div>
    </div>
  </header>

  <!-- 3. Clue Hint Pill (Bottom-Left) -->
  <div class="absolute bottom-5 left-5 z-20 pointer-events-none hidden sm:block">
    <div class="glass-ui px-4 py-2.5 rounded-2xl text-xs text-slate-300 flex items-center gap-2 shadow-2xl">
      <i class="fa-solid fa-compass text-cyan-400 animate-spin" style="animation-duration: 12s;"></i>
      <span>Look around for geography, road signs, architecture, and vegetation clues!</span>
    </div>
  </div>

  <!-- 4. Floating Guess Map (Bottom-Right) -->
  <div id="guess-map-container" class="absolute bottom-5 right-5 minimized glass-ui rounded-3xl p-3 shadow-2xl flex flex-col justify-between">
    <div class="flex items-center justify-between pb-2 px-1">
      <div id="map-header-label" class="text-[11px] font-mono font-bold text-slate-300 flex items-center gap-1.5">
        <i class="fa-solid fa-location-dot text-rose-500"></i> Click Map to Drop Pin
      </div>
      <button onclick="toggleMapSize()" title="Toggle Size" class="text-xs text-slate-400 hover:text-white transition-colors p-1">
        <i id="expand-icon" class="fa-solid fa-expand"></i>
      </button>
    </div>

    <!-- Leaflet Map Element -->
    <div id="leaflet-map" class="w-full flex-1 rounded-2xl overflow-hidden my-1"></div>

    <!-- Guess Submit Button -->
    <button id="btn-submit-guess" onclick="submitGuess()" disabled class="w-full mt-2 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 disabled:opacity-40 disabled:cursor-not-allowed hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black text-xs uppercase tracking-wider transition-all shadow-lg shadow-emerald-500/20">
      Place Pin to Guess
    </button>
  </div>

  <!-- 5. Interactive Post-Round Reveal Result Modal -->
  <div id="result-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md hidden">
    <div class="glass-ui rounded-3xl p-6 sm:p-8 max-w-lg w-full border border-cyan-500/40 shadow-2xl text-center space-y-4">
      
      <div id="result-badge-icon" class="w-16 h-16 rounded-2xl bg-cyan-500/20 border border-cyan-500/30 text-cyan-400 flex items-center justify-center text-3xl mx-auto shadow-lg shadow-cyan-500/20">
        <i class="fa-solid fa-location-crosshairs"></i>
      </div>

      <div>
        <div class="text-[11px] font-mono uppercase tracking-widest text-slate-400 mb-1">Actual Location</div>
        <h3 id="result-location-name" class="text-xl sm:text-2xl font-black text-white leading-tight">Location Name</h3>
        <p id="result-distance-text" class="text-sm font-mono text-cyan-300 font-bold mt-2">You were 0 km away</p>
      </div>

      <!-- Coin Payout Banner -->
      <div class="p-4 rounded-2xl bg-slate-900/90 border border-amber-500/40 flex items-center justify-between shadow-inner">
        <div class="text-left">
          <div class="text-xs font-bold text-white">Coins Awarded</div>
          <div class="text-[10px] text-slate-400">Added to your shared Z-Chess balance</div>
        </div>
        <div class="text-xl font-mono font-black text-amber-400 flex items-center gap-1.5">
          <i class="fa-solid fa-coins"></i>
          <span id="result-coins-awarded">+0 ZC</span>
        </div>
      </div>

      <button onclick="nextRound()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 text-slate-950 font-black text-xs uppercase tracking-wider transition-all shadow-xl shadow-cyan-500/25 flex items-center justify-center gap-2">
        <span>Continue to Next Location</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <!-- SCRIPT LOGIC -->
  <script>
    // --- 1. FIREBASE AUTH & DATABASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyCsV_SJg7cYhZv5srhYw_GBMDwXJ85wGmw",
      authDomain: "chess-7df7a.firebaseapp.com",
      databaseURL: "https://chess-7df7a-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "chess-7df7a",
      storageBucket: "chess-7df7a.firebasestorage.app",
      messagingSenderId: "807640572322",
      appId: "1:807640572322:web:d2b47b747ee30e314a92fb"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let userCoins = 0;

    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;
      db.ref(`users/${user.uid}/coins`).on('value', (snap) => {
        userCoins = snap.val() || 0;
        document.getElementById('player-coins').textContent = userCoins;
      });
    });

    // --- 2. ACCURATE 360° LOCATIONS (COORDINATES MATCH REAL PHOTOS) ---
    const LOCATIONS = [
      {
        name: "ALMA Observatory (Radio Telescopes), Atacama Desert",
        country: "Chile",
        lat: -23.0234,
        lng: -67.7548,
        panorama: "https://pannellum.org/images/alma.jpg",
        description: "Giant radio telescopes in the high Andes plateau"
      },
      {
        name: "John F. Kennedy Presidential Library, Boston",
        country: "United States",
        lat: 42.3161,
        lng: -71.0345,
        panorama: "https://pannellum.org/images/jfk.jpg",
        description: "Waterfront harbor view and modern memorial architecture"
      },
      {
        name: "Historic Pinacoteca di Brera Courtyard, Milan",
        country: "Italy",
        lat: 45.4719,
        lng: 9.1897,
        panorama: "https://pannellum.org/images/bma-0.jpg",
        description: "Renaissance columns and courtyard gardens"
      },
      {
        name: "Cerro Toco Volcano Summit, Atacama",
        country: "Chile",
        lat: -22.9564,
        lng: -67.7772,
        panorama: "https://pannellum.org/images/cerro-toco-0.jpg",
        description: "High-altitude arid Andes volcanic ridge"
      }
    ];

    let currentLocationIndex = 0;
    let currentRound = 1;
    let panoViewer = null;
    let leafletMap = null;
    let guessMarker = null;
    let targetMarker = null;
    let flightPolyline = null;
    let selectedLatLng = null;
    let isRoundFinished = false;

    // --- 3. AUDIO ENGINE ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      play(freq, type, duration) {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      },
      fanfare() {
        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
          setTimeout(() => this.play(f, 'triangle', 0.25), i * 90);
        });
      },
      ping() {
        this.play(880, 'sine', 0.12);
      }
    };

    // --- 4. GAME INITIALIZATION ---
    function initGame() {
      initLeafletMap();
      loadLocation(currentLocationIndex);
    }

    function loadLocation(index) {
      const loc = LOCATIONS[index];
      if (panoViewer) {
        try { panoViewer.destroy(); } catch (e) {}
      }

      panoViewer = pannellum.viewer('panorama-view', {
        type: 'equirectangular',
        panorama: loc.panorama,
        autoLoad: true,
        showZoomCtrl: true,
        showFullscreenCtrl: false,
        compass: true,
        yaw: 0,
        pitch: 0,
        hfov: 100
      });
    }

    function initLeafletMap() {
      leafletMap = L.map('leaflet-map', {
        center: [20, 0],
        zoom: 1,
        minZoom: 1,
        maxZoom: 18,
        zoomControl: false,
        attributionControl: false
      });

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(leafletMap);

      leafletMap.on('click', (e) => {
        if (isRoundFinished) return;

        selectedLatLng = e.latlng;
        AudioEngine.ping();

        const redIcon = L.divIcon({
          className: 'custom-guess-icon',
          html: `<div class="w-5 h-5 rounded-full bg-rose-500 border-2 border-white shadow-lg flex items-center justify-center text-white text-[10px]"><i class="fa-solid fa-location-pin"></i></div>`,
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        });

        if (guessMarker) {
          guessMarker.setLatLng(e.latlng);
        } else {
          guessMarker = L.marker(e.latlng, { icon: redIcon }).addTo(leafletMap);
        }

        const btn = document.getElementById('btn-submit-guess');
        btn.disabled = false;
        btn.textContent = "Submit Guess";
      });
    }

    function toggleMapSize(forceExpand = false) {
      const mapBox = document.getElementById('guess-map-container');
      const icon = document.getElementById('expand-icon');

      if (forceExpand || mapBox.classList.contains('minimized')) {
        mapBox.classList.remove('minimized');
        mapBox.classList.add('expanded');
        icon.classList.remove('fa-expand');
        icon.classList.add('fa-compress');
      } else {
        mapBox.classList.remove('expanded');
        mapBox.classList.add('minimized');
        icon.classList.remove('fa-compress');
        icon.classList.add('fa-expand');
      }
      setTimeout(() => { if (leafletMap) leafletMap.invalidateSize(); }, 320);
    }

    // --- 5. HAVERSINE DISTANCE MATH ---
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth's mean radius in km
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // --- 6. SUBMIT GUESS & REVEAL ---
    async function submitGuess() {
      if (!selectedLatLng || isRoundFinished) return;
      isRoundFinished = true;

      const loc = LOCATIONS[currentLocationIndex];
      const targetLatLng = L.latLng(loc.lat, loc.lng);
      const distKm = Math.round(calculateDistance(selectedLatLng.lat, selectedLatLng.lng, loc.lat, loc.lng));

      // Calculate Coin Award
      let coinsWon = 5;
      if (distKm <= 50) coinsWon = 100;
      else if (distKm <= 350) coinsWon = 60;
      else if (distKm <= 1500) coinsWon = 30;
      else if (distKm <= 5000) coinsWon = 15;

      // Expand map to reveal flight path
      toggleMapSize(true);

      // Plot actual location pin (Green flag)
      const greenIcon = L.divIcon({
        className: 'custom-target-icon',
        html: `<div class="w-6 h-6 rounded-full bg-emerald-500 border-2 border-white shadow-xl flex items-center justify-center text-slate-950 text-xs font-bold animate-bounce"><i class="fa-solid fa-flag"></i></div>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });
      targetMarker = L.marker(targetLatLng, { icon: greenIcon }).addTo(leafletMap);

      // Draw dotted connector line
      flightPolyline = L.polyline([selectedLatLng, targetLatLng], {
        color: '#f59e0b',
        weight: 3,
        dashArray: '6, 8',
        opacity: 0.9
      }).addTo(leafletMap);

      // Fit both markers into view
      const bounds = L.latLngBounds([selectedLatLng, targetLatLng]);
      leafletMap.fitBounds(bounds, { padding: [40, 40] });

      // Play Sound
      AudioEngine.fanfare();

      // Sync Coins with Firebase
      if (currentUser) {
        await db.ref(`users/${currentUser.uid}/coins`).set(userCoins + coinsWon);
      }

      // Show result modal after a brief map reveal
      setTimeout(() => {
        document.getElementById('result-location-name').textContent = `${loc.name}, ${loc.country}`;
        document.getElementById('result-distance-text').textContent = `Your guess was ${distKm.toLocaleString()} km away.`;
        document.getElementById('result-coins-awarded').textContent = `+${coinsWon} ZC`;
        document.getElementById('result-modal').classList.remove('hidden');
      }, 1200);
    }

    function nextRound() {
      document.getElementById('result-modal').classList.add('hidden');

      // Clear map markers
      if (guessMarker) leafletMap.removeLayer(guessMarker);
      if (targetMarker) leafletMap.removeLayer(targetMarker);
      if (flightPolyline) leafletMap.removeLayer(flightPolyline);

      guessMarker = null;
      targetMarker = null;
      flightPolyline = null;
      selectedLatLng = null;
      isRoundFinished = false;

      // Reset map position and size
      const mapBox = document.getElementById('guess-map-container');
      mapBox.classList.remove('expanded');
      mapBox.classList.add('minimized');
      document.getElementById('expand-icon').className = 'fa-solid fa-expand';
      document.getElementById('btn-submit-guess').disabled = true;
      document.getElementById('btn-submit-guess').textContent = "Place Pin to Guess";
      leafletMap.setView([20, 0], 1);

      // Advance round
      currentRound++;
      document.getElementById('round-number').textContent = currentRound;

      currentLocationIndex = (currentLocationIndex + 1) % LOCATIONS.length;
      loadLocation(currentLocationIndex);
    }

    window.onload = initGame;
  </script>
</body>
</html>
