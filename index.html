<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CogniLearn Strategic Thinking Lab - Portal Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Firebase SDK (v8.10.1 compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#151e2e',
                            950: '#070b14',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #070b14;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.7) 0px, transparent 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }
        .glass-input {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            background: rgba(15, 23, 42, 0.9);
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
            outline: none;
        }
        .glow-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
            transition: all 0.2s ease;
        }
        .glow-btn:hover {
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
            transform: translateY(-1px);
        }
        .glow-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="text-slate-100 flex items-center justify-center min-h-screen p-4">

    <!-- Main Container -->
    <div class="w-full max-w-md relative z-10">
        
        <!-- Header Branding -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-violet-500 shadow-xl shadow-blue-500/20 mb-3 border border-blue-400/30">
                <i class="fa-solid fa-chess-knight text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white uppercase">Cogni<span class="text-blue-500">Learn</span></h1>
            <p class="text-xs font-semibold tracking-wider text-slate-400 uppercase mt-0.5">Strategic Thinking Laboratory & 1v1 Arena</p>
        </div>

        <!-- Auth Card -->
        <div class="glass-panel rounded-2xl p-6 sm:p-8 relative overflow-hidden">
            <!-- Alert Banner -->
            <div id="auth-alert" class="hidden mb-4 p-3 rounded-xl text-xs font-medium flex items-center gap-2 border"></div>

            <!-- Tab Switcher -->
            <div class="flex bg-slate-900/80 p-1 rounded-xl mb-6 border border-white/5">
                <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-200 bg-blue-600 text-white shadow-md">
                    <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Sign In
                </button>
                <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-200 text-slate-400 hover:text-white">
                    <i class="fa-solid fa-user-plus mr-1.5"></i> Register
                </button>
            </div>

            <!-- LOGIN FORM -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                            <i class="fa-solid fa-envelope text-xs"></i>
                        </span>
                        <input type="email" id="login-email" required placeholder="player@cognilearn.org" class="glass-input w-full pl-10 pr-3 py-2.5 rounded-xl text-sm placeholder-slate-500 font-medium">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
                        <a href="javascript:void(0)" onclick="handleForgotPassword()" class="text-xs font-medium text-blue-400 hover:text-blue-300 transition-colors">Forgot?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock text-xs"></i>
                        </span>
                        <input type="password" id="login-password" required placeholder="••••••••••••" class="glass-input w-full pl-10 pr-3 py-2.5 rounded-xl text-sm placeholder-slate-500 font-medium">
                    </div>
                </div>

                <button type="submit" id="login-submit-btn" class="glow-btn w-full py-3 rounded-xl text-sm font-bold text-white flex items-center justify-center gap-2 mt-2">
                    <span>Enter Laboratory</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Tactical Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                            <i class="fa-solid fa-user-astronaut text-xs"></i>
                        </span>
                        <input type="text" id="reg-username" required minlength="3" maxlength="15" placeholder="GrandmasterX" class="glass-input w-full pl-10 pr-3 py-2.5 rounded-xl text-sm placeholder-slate-500 font-medium">
                    </div>
                    <span class="text-[10px] text-slate-400 mt-1 block">Displayed on arena leaderboards & matches</span>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                            <i class="fa-solid fa-envelope text-xs"></i>
                        </span>
                        <input type="email" id="reg-email" required placeholder="tactician@domain.com" class="glass-input w-full pl-10 pr-3 py-2.5 rounded-xl text-sm placeholder-slate-500 font-medium">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Security Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock text-xs"></i>
                        </span>
                        <input type="password" id="reg-password" required minlength="6" placeholder="Minimum 6 characters" class="glass-input w-full pl-10 pr-3 py-2.5 rounded-xl text-sm placeholder-slate-500 font-medium">
                    </div>
                </div>

                <div class="p-3 bg-blue-950/40 border border-blue-500/20 rounded-xl text-[11px] text-blue-200/90 leading-relaxed">
                    <i class="fa-solid fa-award text-yellow-400 mr-1.5"></i> Initializing rating at standard baseline <strong>500 Elo</strong> + <strong>1,000 Coins</strong>.
                </div>

                <button type="submit" id="reg-submit-btn" class="glow-btn w-full py-3 rounded-xl text-sm font-bold text-white flex items-center justify-center gap-2 mt-2">
                    <span>Create Strategist Account</span>
                    <i class="fa-solid fa-shield-halved text-xs"></i>
                </button>
            </form>
        </div>

        <!-- Footer Notice -->
        <div class="text-center mt-6 text-xs text-slate-500 font-medium">
            Strategic Thinking Laboratory &copy; 2025. All Rights Reserved.
        </div>
    </div>

    <!-- Script Flow -->
    <script>
        // Exact Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCsV_SJg7cYhZv5srhYw_GBMDwXJ85wGmw",
            authDomain: "chess-7df7a.firebaseapp.com",
            databaseURL: "https://chess-7df7a-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chess-7df7a",
            storageBucket: "chess-7df7a.firebasestorage.app",
            messagingSenderId: "807640572322",
            appId: "1:807640572322:web:d2b47b747ee30e314a92fb"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.database();

        // Check if already authenticated -> go straight to app.html
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.replace("app.html");
            }
        });

        function switchAuthTab(tab) {
            const loginBtn = document.getElementById('tab-login');
            const regBtn = document.getElementById('tab-register');
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            clearAlert();

            if (tab === 'login') {
                loginBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-200 bg-blue-600 text-white shadow-md";
                regBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-200 text-slate-400 hover:text-white";
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
            } else {
                regBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-200 bg-blue-600 text-white shadow-md";
                loginBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-200 text-slate-400 hover:text-white";
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        function showAlert(msg, isError = true) {
            const el = document.getElementById('auth-alert');
            el.className = isError 
                ? "mb-4 p-3 rounded-xl text-xs font-medium flex items-center gap-2 border bg-rose-950/60 border-rose-500/40 text-rose-200" 
                : "mb-4 p-3 rounded-xl text-xs font-medium flex items-center gap-2 border bg-emerald-950/60 border-emerald-500/40 text-emerald-200";
            el.innerHTML = `<i class="fa-solid ${isError ? 'fa-triangle-exclamation text-rose-400' : 'fa-circle-check text-emerald-400'}"></i> <span>${msg}</span>`;
            el.classList.remove('hidden');
        }

        function clearAlert() {
            document.getElementById('auth-alert').classList.add('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            clearAlert();
            const btn = document.getElementById('login-submit-btn');
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...`;

            try {
                await auth.signInWithEmailAndPassword(email, password);
                // Listener handles instant redirect
            } catch (err) {
                showAlert(err.message || "Failed to sign in. Please verify your credentials.");
                btn.disabled = false;
                btn.innerHTML = `<span>Enter Laboratory</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            clearAlert();
            const btn = document.getElementById('reg-submit-btn');
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            if (username.length < 3) {
                showAlert("Username must be at least 3 characters long.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Initializing Dossier...`;

            try {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                const uid = cred.user.uid;

                // Create Database Profile strictly at 500 Starting Elo
                await db.ref(`users/${uid}`).set({
                    uid: uid,
                    username: username,
                    email: email,
                    elo: 500,
                    coins: 1000,
                    solvedPuzzles: 0,
                    puzzleStreak: 0,
                    role: email.toLowerCase() === 'zainisgo123@gmail.com' ? 'superadmin' : 'player',
                    createdAt: firebase.database.ServerValue.TIMESTAMP,
                    inventory: {
                        icons: { icon_user: true },
                        frames: { frame_none: true },
                        nametags: { nametag_novice: true },
                        themes: { 'theme-wood': true },
                        particles: { none: true }
                    },
                    equipped: {
                        icon: 'icon_user',
                        frame: 'frame_none',
                        nametag: 'nametag_novice',
                        theme: 'theme-wood',
                        particle: 'none'
                    }
                });

                // Authenticated listener triggers app.html redirect
            } catch (err) {
                showAlert(err.message || "Registration failed. Try a different email.");
                btn.disabled = false;
                btn.innerHTML = `<span>Create Strategist Account</span> <i class="fa-solid fa-shield-halved text-xs"></i>`;
            }
        }

        async function handleForgotPassword() {
            const email = document.getElementById('login-email').value.trim();
            if (!email) {
                showAlert("Please enter your email above to receive a password reset link.");
                return;
            }
            try {
                await auth.sendPasswordResetEmail(email);
                showAlert("Password reset link sent! Check your inbox.", false);
            } catch (err) {
                showAlert(err.message || "Could not send reset email.");
            }
        }
    </script>
</body>
</html>
